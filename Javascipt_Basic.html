<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Basic</title>
</head>

<body>

    <h1>JavaScript Example</h1>

    <p id="result"></p>

    <script>

        let a = 10;
        let b = 20;

        let sum = a + b;
        let name = "Khushi";

        document.getElementById("result").innerHTML =
            "Name: " + name + "<br>" +
            "First Number: " + a + "<br>" +
            "Second Number: " + b + "<br>" +
            "Sum: " + sum;

    </script>

</body>
</html>
