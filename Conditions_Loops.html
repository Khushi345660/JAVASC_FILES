<!DOCTYPE html>
<html>
<head>
    <title>Conditions and Loops</title>
</head>

<body>

    <h1>JavaScript Conditions and Loops</h1>

    <p id="result"></p>

    <script>

        let number = 5;
        let output = "";

        if (number > 0) {
            output += "Number is Positive<br>";
        }
        else {
            output += "Number is Negative<br>";
        }

        output += "Numbers from 1 to 5:<br>";

        for (let i = 1; i <= 5; i++) {
            output += i + "<br>";
        }

        document.getElementById("result").innerHTML = output;

    </script>

</body>
</html>
